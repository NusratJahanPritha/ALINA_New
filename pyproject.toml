[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alina"
version = "1.0.0"
description = "ALINA: Advanced Line Identification and Notation Algorithm"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
]

[project.scripts]
alina = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["alina*", "eval*"]